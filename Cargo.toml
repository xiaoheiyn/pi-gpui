[package]
name = "pi-gpui"
# The app's own version; supported pi versions are in src/pi.rs (MIN_PI, TESTED_PI).
version = "0.2.8"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { package = "gpui-fast", version = "=0.1.17", default-features = false }
futures = "0.3"
serde_json = "1"
unicode-segmentation = "1"
# Both already come with gpui; used to drag the window by our own title bar.
raw-window-handle = "0.6"
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
base64 = "0.23.1"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
regex = "1"
# Already comes with gpui; local time for message timestamps.
libc = "0.2"
# Already comes with gpui; decodes plugin view frames without the async asset cache.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 字体后端和运行时着色器让发行构建无需安装额外的 Metal 工具链。
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.17", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc = "0.2"
# Already comes with gpui; Objective-C blocks for the folder picker's completion handler.
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.17", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.17", default-features = false }
dunce = "1"
interprocess = "2.4"
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"

[profile.dev]
# GPUI is slow in unoptimized builds; optimize dependencies, keep our code debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
